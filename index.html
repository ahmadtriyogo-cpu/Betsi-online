<!-- index.html — PART 1 of 3 (MASTER from Google Sheet) -->
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BETSI Online — Final (Part 1)</title>

  <!-- Firebase compat (firestore compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- SheetJS (only used if client-side parsing needed later) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#1967d2}
    body{font-family:Inter,system-ui,Arial, Helvetica, sans-serif;margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg,#2f7bff,#6bb1ff);color:#fff;padding:16px}
    .wrap{max-width:1040px;margin:18px auto;padding:14px}
    .card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 8px 20px rgba(20,30,60,0.06)}
    input,select,textarea,button{font-size:14px}
    input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8;margin-top:8px;box-sizing:border-box}
    button{padding:9px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    button.ghost{background:#eef3ff;color:var(--accent);border:1px solid #dceaff}
    .row{display:flex;gap:10px}
    .row .col{flex:1}
    .small{font-size:13px;color:#666}
    .muted{color:#888;font-size:13px}
    .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;border:1px solid #eef2ff;margin-bottom:8px;background:#fff}
    .meta{font-size:13px;color:#444}
    .danger{background:#ff4d4f;color:#fff;border:0;padding:8px;border-radius:6px}
    pre{white-space:pre-wrap;word-break:break-word}
    @media(max-width:860px){.row{flex-direction:column}}
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h2 style="margin:0">BETSI Online — Final</h2>
        <div class="small">AHT ● ISD ● MANAGER — Master: Google Sheet (live)</div>
      </div>
      <div id="userPanel" style="text-align:right" class="small"></div>
    </div>
  </header>

  <main class="wrap">
    <!-- LOGIN -->
    <section id="loginCard" class="card">
      <strong>Login (akun lokal)</strong>
      <div class="row" style="margin-top:8px">
        <div class="col">
          <label>Username</label>
          <input id="username" placeholder="aht / isd / manager">
        </div>
        <div style="width:220px">
          <label>Password</label>
          <input id="password" type="password" placeholder="password">
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="col"><button id="btnLogin">Login</button></div>
        <div style="width:200px"><button id="btnDemo" class="ghost">Isi demo akun</button></div>
      </div>
      <div id="loginMsg" class="muted" style="margin-top:8px"></div>
    </section>

    <!-- APP area placeholder -->
    <section id="appArea" style="display:none">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="small">Signed in as</div>
          <div id="roleLabel" style="font-weight:700">-</div>
        </div>
        <div style="text-align:right">
          <div id="currentShiftDisplay" class="small muted"></div>
          <div style="margin-top:6px"><button id="btnLogout" class="ghost">Logout</button></div>
        </div>
      </div>

      <!-- Panels -->
      <div id="panelsPlaceholder"></div>
      <!-- AHT / ISD / Manager containers -->
      <div id="panelAht" class="card" style="display:none"></div>
      <div id="panelIsd" class="card" style="display:none"></div>
      <div id="panelManager" class="card" style="display:none"></div>
    </section>
  </main>

  <!-- PART 1 JS -->
  <script>
  /************************************************************************
   * PART 1 JS — Firebase init, constants, helpers, Sheet API helpers
   ************************************************************************/

  // =================== FIREBASE CONFIG (GANTI SEBELUM DIPAKAI) ===================
  // Dapatkan config dari Firebase Console -> Project settings -> SDK config
  const firebaseConfig = {
    apiKey: "PASTE_APIKEY",
    authDomain: "PASTE_AUTHDOMAIN",
    projectId: "PASTE_PROJECTID",
    // optional: storageBucket, messagingSenderId, appId
  };
  // ==============================================================================

  // init firebase (compat)
  if (firebaseConfig && firebaseConfig.projectId) {
    firebase.initializeApp(firebaseConfig);
  } else {
    console.warn('firebaseConfig belum diisi — ganti sebelum deploy.');
  }
  const db = firebase.firestore();

  // =================== Google Apps Script Webhook URL ===================
  // Ganti dengan Web App URL dari Apps Script (yang Kodok deploy)
  const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx_B6MsBNRuyDrZYokgiQJg2bPY3CfzCXHBY0HdthPt6U4cNC3iCWHNMnn_p_TuzUblDw/exec";
  // ======================================================================

  // Local accounts (simple local login for demo)
  const ACCOUNTS = { aht:"aht123", isd:"isd123", manager:"mgr123" };
  let CURRENT = { user:null, role:null }; // roles: AHT, ISD, MANAGER

  // UI refs
  const loginCard = document.getElementById('loginCard');
  const appArea = document.getElementById('appArea');
  const roleLabel = document.getElementById('roleLabel');
  const userPanel = document.getElementById('userPanel');
  const loginMsg = document.getElementById('loginMsg');
  const panelsPlaceholder = document.getElementById('panelsPlaceholder');

  // login events
  document.getElementById('btnDemo').addEventListener('click', ()=> {
    document.getElementById('username').value='aht';
    document.getElementById('password').value='aht123';
    login();
  });
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnLogout').addEventListener('click', ()=> location.reload());

  function login(){
    const u = (document.getElementById('username').value||'').trim().toLowerCase();
    const p = (document.getElementById('password').value||'').trim();
    if(!u||!p){ loginMsg.innerText = 'Isi username & password.'; return; }
    if(ACCOUNTS[u] && ACCOUNTS[u] === p){
      CURRENT.user = u;
      CURRENT.role = (u === 'manager') ? 'MANAGER' : (u === 'aht' ? 'AHT' : 'ISD');
      loginCard.style.display = 'none';
      appArea.style.display = 'block';
      roleLabel.innerText = CURRENT.role;
      userPanel.innerHTML = `<div class="small">User: <b>${CURRENT.user}</b></div>`;
      // load panels placeholders and init appropriate UI in Part 2/3
      loadPanelsPlaceholder();
      startRealtimeStub(); // real listener replaced in Part 3
    } else {
      loginMsg.innerText = 'Username atau password salah.';
    }
  }

  function loadPanelsPlaceholder(){
    // Show panels according to role
    document.getElementById('panelAht').style.display = (CURRENT.role==='AHT')?'block':'none';
    document.getElementById('panelIsd').style.display = (CURRENT.role==='ISD')?'block':'none';
    document.getElementById('panelManager').style.display = (CURRENT.role==='MANAGER')?'block':'none';
  }

  // ================ HELPERS ===============================================
  function normalizePhone(phone){
    if(!phone) return '';
    let n = String(phone).replace(/\D/g,'');
    if(n.startsWith('0')) n = '62' + n.slice(1);
    if(n.startsWith('8')) n = '62' + n;
    return n;
  }
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

  // ================ MASTER (Google Sheet) FUNCTIONS =======================
  // load master directly from Sheet via GET action
  // expects Apps Script doGet to output JSON array with header keys, e.g. {Nama,HP,Lambung,Status,Keterangan}
  let MASTER_CACHE = []; // array of { rowIndex, name, phone, lambung, status_driver, note, phone_e164 }

  async function loadMasterFromSheet(){
    try {
      const resp = await fetch(SHEET_WEBHOOK_URL + "?action=get_master");
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const arr = await resp.json();

      MASTER_CACHE = arr.map((r, i) => ({
        rowIndex: i + 2, // spreadsheet row (1 = header)
        name: r['Nama'] || r['name'] || r['Nama'] || '',
        phone: r['HP'] || r['hp'] || r['Phone'] || '',
        lambung: r['Lambung'] || r['lambung'] || '',
        status_driver: r['Status'] || r['status'] || '',
        note: r['Keterangan'] || r['Keterangan'] || r['Keterangan'] || '',
        phone_e164: normalizePhone(r['HP'] || r['hp'] || r['Phone'] || '')
      }));

      // if element exists (panel rendered), call render function (defined in Part 2)
      if(typeof renderMasterList === 'function') renderMasterList();
      return MASTER_CACHE;
    } catch(err){
      console.error('loadMasterFromSheet error', err);
      const area = document.getElementById('masterList');
      if(area) area.innerHTML = "<div class='muted'>Gagal mengambil data dari spreadsheet.</div>";
      return [];
    }
  }

  // Add driver to Google Sheet (via Apps Script doPost action=add_driver)
  async function addDriverToSheet(driverObj){
    // driverObj: { Nama, HP, Lambung, Status, Keterangan }
    try {
      const resp = await fetch(SHEET_WEBHOOK_URL + "?action=add_driver", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(driverObj)
      });
      const txt = await resp.text();
      return txt;
    } catch(err){
      console.error('addDriverToSheet error', err); throw err;
    }
  }

  // Update driver in sheet (action=update_driver) - needs rowIndex
  async function updateDriverInSheet(payload){
    // payload: { rowIndex, Nama, HP, Lambung, Status, Keterangan }
    try {
      const resp = await fetch(SHEET_WEBHOOK_URL + "?action=update_driver", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const txt = await resp.text();
      return txt;
    } catch(err){
      console.error('updateDriverInSheet error', err); throw err;
    }
  }

  // Delete driver in sheet (action=delete_driver) - needs rowIndex
  async function deleteDriverInSheet(rowIndex){
    try {
      const resp = await fetch(SHEET_WEBHOOK_URL + "?action=delete_driver", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rowIndex })
      });
      const txt = await resp.text();
      return txt;
    } catch(err){
      console.error('deleteDriverInSheet error', err); throw err;
    }
  }
  // ========================================================================

  // pushToGoogleSheet kept for backward compatibility (wrapper to addDriverToSheet)
  async function pushToGoogleSheet(driverData){
    // driverData: { name, phone, phone_e164, lambung, status_driver, note, source, shift_date, shift_type, addedBy }
    try {
      const payload = {
        Nama: driverData.name || '',
        HP: driverData.phone || driverData.phone_e164 || '',
        Lambung: driverData.lambung || '',
        Status: driverData.status_driver || '',
        Keterangan: driverData.note || ''
      };
      return await addDriverToSheet(payload);
    } catch(err){
      console.warn('pushToGoogleSheet failed', err);
      return null;
    }
  }

  // stub for realtime start (replaced in Part 3)
  function startRealtimeStub(){
    console.log('Realtime initialization stub (real listeners in Part 3).');
  }

  // Expose for other parts
  window.SHEET_WEBHOOK_URL = SHEET_WEBHOOK_URL;
  window.loadMasterFromSheet = loadMasterFromSheet;
  window.addDriverToSheet = addDriverToSheet;
  window.updateDriverInSheet = updateDriverInSheet;
  window.deleteDriverInSheet = deleteDriverInSheet;
  window.pushToGoogleSheet = pushToGoogleSheet;
  window.MASTER_CACHE = MASTER_CACHE;
  window.CURRENT = CURRENT;
  window.db = db;

  // Auto-load master once UI ready (Part 2 will re-call when needed)
  // don't call automatically here because Part2 will call loadMasterFromSheet when rendered
  // but we can prefetch:
  // loadMasterFromSheet();

  </script>
</body>
</html>
<!-- PART 2: AHT UI & Logic -->
<script>
/************************************************************************
 * PART 2 — AHT PANEL: Master DB + Daily Input (Ready List)
 ************************************************************************/

function renderAHTPanel() {
  const html = `
    <div class="card">
      <h3>AHT — Input & Master Driver</h3>

      <div class="row">
        <div class="col">
          <label>Tanggal Shift</label>
          <input id="shiftDate" type="date">
        </div>
        <div style="width:220px">
          <label>Jenis Shift</label>
          <select id="shiftType">
            <option>Mitra Pagi</option>
            <option>Mitra Malam</option>
          </select>
        </div>
      </div>

      <hr style="margin:12px 0">

      <h4>Tambah Driver Manual</h4>
      <div class="row">
        <div class="col">
          <label>Nama</label>
          <input id="manual_name">
        </div>
        <div style="width:180px">
          <label>No HP</label>
          <input id="manual_phone">
        </div>
      </div>

      <div class="row" style="margin-top:8px">
        <div class="col">
          <label>Lambung</label>
          <input id="manual_lambung">
        </div>
        <div style="width:200px">
          <label>Status Driver</label>
          <select id="manual_status">
            <option>Batangan</option>
            <option>Tembak</option>
            <option>Koperasi</option>
          </select>
        </div>
      </div>

      <label style="margin-top:6px">Keterangan</label>
      <input id="manual_note">

      <button id="btnAddManual" style="margin-top:10px">Tambah ke Master</button>

      <hr style="margin:14px 0">

      <h4>Master Driver List</h4>
      <div class="row">
        <div class="col">
          <input id="masterSearch" placeholder="Cari nama / hp / lambung">
        </div>
        <div style="width:220px">
          <button id="btnSelectAll" class="ghost">Pilih Semua</button>
          <button id="btnClearSelection" class="ghost">Clear</button>
        </div>
      </div>

      <div id="masterList" style="margin-top:12px;max-height:330px;overflow:auto;border:1px solid #eef3ff;border-radius:10px;"></div>

      <button id="btnAddToReady" style="margin-top:12px">Tambahkan ke READY</button>
      <button id="btnOpenReady" class="ghost" style="margin-top:12px">Buka Ready List</button>

      <div id="ahtStatus" class="muted" style="margin-top:8px"></div>
    </div>
  `;

  document.getElementById("panelAht").innerHTML = html;

  document.getElementById("shiftDate").value = new Date().toISOString().slice(0,10);

  // Events
  document.getElementById("btnAddManual").onclick = addManualHandler;
  document.getElementById("masterSearch").oninput = renderMasterList;
  document.getElementById("btnSelectAll").onclick = () =>
    document.querySelectorAll(".masterCheck").forEach(c => c.checked = true);
  document.getElementById("btnClearSelection").onclick = () =>
    document.querySelectorAll(".masterCheck").forEach(c => c.checked = false);
  document.getElementById("btnAddToReady").onclick = addSelectedToDailyInput;
  document.getElementById("btnOpenReady").onclick = renderReadyListUI;

  // Load master from Sheet
  loadMasterFromSheet();
}

/***********************************************************************
 * RENDER MASTER LIST
 ***********************************************************************/
function renderMasterList() {
  const area = document.getElementById("masterList");
  if (!area) return;

  const q = (document.getElementById("masterSearch").value || "").toLowerCase();

  let list = MASTER_CACHE.slice();
  if (q) {
    list = list.filter(d =>
      (d.name + " " + d.phone + " " + d.lambung).toLowerCase().includes(q)
    );
  }

  if (list.length === 0) {
    area.innerHTML = `<div class='muted' style='padding:10px'>Tidak ada data master.</div>`;
    return;
  }

  area.innerHTML = list.map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;
                padding:8px;border-bottom:1px solid #eef3ff">
      <div style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" class="masterCheck" data-row="${d.rowIndex}">
        <div>
          <strong>${escapeHtml(d.name)}</strong>
          <div class="small muted">${escapeHtml(d.phone)} • ${escapeHtml(d.lambung)}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ghost" onclick="openEditMaster(${d.rowIndex})">Edit</button>
        <button class="danger" onclick="deleteMasterDriver(${d.rowIndex})">Hapus</button>
      </div>
    </div>
  `).join("");
}

/***********************************************************************
 * TAMBAH MANUAL KE SPREADSHEET
 ***********************************************************************/
async function addManualHandler() {
  const nm = document.getElementById("manual_name").value.trim();
  const hp = document.getElementById("manual_phone").value.trim();
  const lb = document.getElementById("manual_lambung").value.trim();
  const st = document.getElementById("manual_status").value;
  const nt = document.getElementById("manual_note").value.trim();

  if (!nm || !hp) return alert("Nama & HP wajib diisi");

  const payload = {
    Nama: nm,
    HP: hp,
    Lambung: lb,
    Status: st,
    Keterangan: nt
  };

  await addDriverToSheet(payload);

  alert("Driver berhasil ditambahkan ke database (Spreadsheet)");
  loadMasterFromSheet();
}

/***********************************************************************
 * EDIT MASTER (UPDATE ROW DI SHEET)
 ***********************************************************************/
async function openEditMaster(rowIndex) {
  const d = MASTER_CACHE.find(x => x.rowIndex === rowIndex);
  if (!d) return alert("Data tidak ditemukan");

  const Nama = prompt("Nama:", d.name);
  if (Nama === null) return;

  const HP = prompt("HP:", d.phone);
  if (HP === null) return;

  const Lambung = prompt("Lambung:", d.lambung);
  const Status = prompt("Status Driver:", d.status_driver);
  const Keterangan = prompt("Keterangan:", d.note);

  const payload = { rowIndex, Nama, HP, Lambung, Status, Keterangan };

  await updateDriverInSheet(payload);

  alert("Berhasil diupdate");
  loadMasterFromSheet();
}

/***********************************************************************
 * DELETE / HAPUS DRIVER DARI SHEET
 ***********************************************************************/
async function deleteMasterDriver(rowIndex) {
  if (!confirm("Hapus driver dari database?")) return;

  await deleteDriverInSheet(rowIndex);

  alert("Driver dihapus.");
  loadMasterFromSheet();
}

/***********************************************************************
 * PILIH DRIVER → MASUKKAN DAILY INPUT FIRESTORE
 ***********************************************************************/
async function addSelectedToDailyInput() {
  const checks = [...document.querySelectorAll(".masterCheck")].filter(c => c.checked);
  if (checks.length === 0) return alert("Pilih driver dulu");

  const dt = document.getElementById("shiftDate").value;
  const st = document.getElementById("shiftType").value;

  let count = 0;

  for (const cb of checks) {
    const rowIndex = parseInt(cb.dataset.row);
    const d = MASTER_CACHE.find(x => x.rowIndex === rowIndex);
    if (!d) continue;

    await db.collection("dailyInput").add({
      name: d.name,
      phone: d.phone,
      phone_e164: d.phone_e164,
      lambung: d.lambung,
      status_driver: d.status_driver,
      note: d.note,
      shift_date: dt,
      shift_type: st,
      feedback: "",
      subfeedback: "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      addedBy: CURRENT.user
    });

    count++;
  }

  alert(`Ditambahkan ${count} driver ke READY`);
}

/***********************************************************************
 * READY LIST (AHT MELIHAT & EDIT)
 ***********************************************************************/
async function renderReadyListUI() {
  const dt = document.getElementById("shiftDate").value;
  const st = document.getElementById("shiftType").value;

  const snap = await db.collection("dailyInput")
    .where("shift_date", "==", dt)
    .where("shift_type", "==", st)
    .orderBy("createdAt", "asc")
    .get();

  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  let html = `<h3>Ready List — ${st}, ${dt}</h3><ol>`;

  list.forEach(r => {
    html += `
      <li style="margin-bottom:8px;border:1px solid #eef3ff;border-radius:8px;padding:10px">
        <strong>${escapeHtml(r.name)}</strong> • ${escapeHtml(r.phone)} • ${escapeHtml(r.lambung)}
        <br><span class="small muted">AddedBy: ${escapeHtml(r.addedBy)}</span>
        <br>
        <button onclick="editReadyItem('${r.id}')" class="ghost">Edit</button>
        <button onclick="deleteReadyItem('${r.id}')" class="danger">Hapus</button>
      </li>
    `;
  });

  html += `</ol>`;

  const w = window.open("", "_blank");
  w.document.write(html);
}

async function editReadyItem(id) {
  const snap = await db.collection("dailyInput").doc(id).get();
  const d = snap.data();

  const name = prompt("Nama:", d.name);
  if (name === null) return;

  const phone = prompt("HP:", d.phone);
  const lambung = prompt("Lambung:", d.lambung);
  const note = prompt("Keterangan:", d.note);

  await db.collection("dailyInput").doc(id).update({
    name,
    phone,
    phone_e164: normalizePhone(phone),
    lambung,
    note,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: CURRENT.user
  });

  alert("Updated");
}

async function deleteReadyItem(id) {
  if (!confirm("Hapus entry ini?")) return;

  await db.collection("dailyInput").doc(id).delete();
  alert("Dihapus");
}

/***********************************************************************
 * AUTO-RENDER AHT PANEL SAAT LOGIN
 ***********************************************************************/
(function waitForRole() {
  const t = setInterval(() => {
    if (CURRENT.role === "AHT") {
      renderAHTPanel();
      clearInterval(t);
    }
  }, 300);
})();
</script>
<!-- PART 3: ISD + Manager + Realtime Listener -->
<script>
/************************************************************************
 * PART 3 — Panel ISD: Feedback Driver
 ************************************************************************/

function renderISDPanel() {
  const html = `
    <h3>ISD — Umpan Balik Driver</h3>

    <div class="row">
      <div class="col">
        <label>Tanggal Shift</label>
        <input id="isdDate" type="date">
      </div>
      <div style="width:220px">
        <label>Jenis Shift</label>
        <select id="isdShift">
          <option>Mitra Pagi</option>
          <option>Mitra Malam</option>
        </select>
      </div>
    </div>

    <button id="isdLoad" style="margin-top:10px">Muat List READY</button>

    <div id="isdList" style="margin-top:14px"></div>
  `;

  document.getElementById("panelIsd").innerHTML = html;
  document.getElementById("isdDate").value = new Date().toISOString().slice(0,10);

  document.getElementById("isdLoad").onclick = loadISDReadyList;
}

async function loadISDReadyList() {
  const dt = document.getElementById("isdDate").value;
  const st = document.getElementById("isdShift").value;

  const div = document.getElementById("isdList");
  div.innerHTML = `<div class="muted">Memuat data...</div>`;

  const snap = await db.collection("dailyInput")
    .where("shift_date", "==", dt)
    .where("shift_type", "==", st)
    .orderBy("createdAt")
    .get();

  if (snap.empty) {
    div.innerHTML = "<div class='muted'>Tidak ada driver READY</div>";
    return;
  }

  let html = "<ol>";

  snap.docs.forEach(doc => {
    const d = doc.data();
    const id = doc.id;

    html += `
      <li style="margin-bottom:10px;padding:10px;border:1px solid #eef3ff;border-radius:10px">
        <strong>${escapeHtml(d.name)}</strong> • ${escapeHtml(d.phone)} • ${escapeHtml(d.lambung)}
        <br><span class="small muted">AddedBy: ${escapeHtml(d.addedBy)}</span>

        <div style="margin-top:6px">
          <label class="small">Status:</label>
          <select id="fb_${id}">
            <option value="">(Pilih)</option>
            <option value="USED" ${d.feedback==="USED"?"selected":""}>USED (sedang bekerja)</option>
            <option value="OFF" ${d.feedback==="OFF"?"selected":""}>OFF</option>
            <option value="CANCEL" ${d.feedback==="CANCEL"?"selected":""}>CANCEL (No response)</option>
          </select>
        </div>

        <div style="margin-top:6px">
          <label class="small">Substatus (off):</label>
          <select id="sub_${id}">
            <option value="">-</option>
            <option value="OPER" ${d.subfeedback==="OPER"?"selected":""}>OPER (pindah armada)</option>
            <option value="IJIN" ${d.subfeedback==="IJIN"?"selected":""}>IJIN</option>
            <option value="SAKIT" ${d.subfeedback==="SAKIT"?"selected":""}>SAKIT</option>
            <option value="DLL" ${d.subfeedback==="DLL"?"selected":""}>DLL</option>
          </select>
        </div>

        <button onclick="saveISDFeedback('${id}')" class="ghost" style="margin-top:6px">Simpan</button>
      </li>
    `;
  });

  html += "</ol>";
  div.innerHTML = html;
}

async function saveISDFeedback(id) {
  const fb = document.getElementById("fb_" + id).value;
  const sb = document.getElementById("sub_" + id).value;

  await db.collection("dailyInput").doc(id).update({
    feedback: fb,
    subfeedback: sb,
    updatedBy: CURRENT.user,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Feedback berhasil disimpan");
}

/************************************************************************
 * PART 3 — Manager Dashboard (Realtime Summary)
 ************************************************************************/

function renderManagerPanel() {
  const html = `
    <h3>Manager — Dashboard Realtime</h3>

    <div class="row">
      <div class="col">
        <label>Tanggal Shift</label>
        <input id="mgrDate" type="date">
      </div>
      <div style="width:220px">
        <label>Jenis Shift</label>
        <select id="mgrShift">
          <option>Mitra Pagi</option>
          <option>Mitra Malam</option>
        </select>
      </div>
    </div>

    <button id="mgrLoad" style="margin-top:10px">Tampilkan Dashboard</button>

    <div id="mgrSummary" style="margin-top:14px"></div>
    <div id="mgrTable" style="margin-top:14px"></div>
  `;

  document.getElementById("panelManager").innerHTML = html;
  document.getElementById("mgrDate").value = new Date().toISOString().slice(0,10);

  document.getElementById("mgrLoad").onclick = loadManagerDashboard;
}

async function loadManagerDashboard() {
  const dt = document.getElementById("mgrDate").value;
  const st = document.getElementById("mgrShift").value;

  const summaryDiv = document.getElementById("mgrSummary");
  const tableDiv = document.getElementById("mgrTable");

  summaryDiv.innerHTML = "<div class='muted'>Memuat...</div>";
  tableDiv.innerHTML = "";

  const snap = await db.collection("dailyInput")
    .where("shift_date", "==", dt)
    .where("shift_type", "==", st)
    .orderBy("createdAt")
    .get();

  const rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));

  const ready = rows.length;
  const used = rows.filter(r => r.feedback === "USED").length;
  const cancel = rows.filter(r => r.feedback === "CANCEL").length;
  const off = rows.filter(r => r.feedback === "OFF").length;
  const oper = rows.filter(r => r.subfeedback === "OPER").length;
  const ijin = rows.filter(r => r.subfeedback === "IJIN").length;
  const sakit = rows.filter(r => r.subfeedback === "SAKIT").length;

  summaryDiv.innerHTML = `
    <div class="card" style="background:#f2f6ff">
      <strong>Summary — ${st}, ${dt}</strong>
      <div class="small">Total READY: ${ready}</div>
      <div class="small">USED: ${used}</div>
      <div class="small">OFF: ${off} (OPER ${oper}, IJIN ${ijin}, SAKIT ${sakit})</div>
      <div class="small">CANCEL: ${cancel}</div>
    </div>
  `;

  // Detail table
  let table = `
    <div class="card">
      <h4>Detail</h4>
      <table border="1" width="100%" style="border-collapse:collapse;font-size:13px">
        <tr style="background:#eaf0ff">
          <th>Nama</th>
          <th>HP</th>
          <th>Lambung</th>
          <th>Status</th>
          <th>Substatus</th>
          <th>Updated</th>
        </tr>
  `;

  rows.forEach(r => {
    const updated = r.updatedAt && r.updatedAt.toDate ? r.updatedAt.toDate().toLocaleString() : "";
    table += `
      <tr>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.phone)}</td>
        <td>${escapeHtml(r.lambung || "-")}</td>
        <td>${escapeHtml(r.feedback || "")}</td>
        <td>${escapeHtml(r.subfeedback || "")}</td>
        <td>${updated}</td>
      </tr>
    `;
  });

  table += `</table></div>`;
  tableDiv.innerHTML = table;
}

/************************************************************************
 * PART 3 — Realtime Listener Firestore
 ************************************************************************/

function startRealtimeStub() {
  startRealtimeListeners();
}

function startRealtimeListeners() {
  if (CURRENT.role === "ISD") {
    db.collection("dailyInput").onSnapshot(() => {
      const dt = document.getElementById("isdDate")?.value;
      const st = document.getElementById("isdShift")?.value;
      if (dt && st) loadISDReadyList();
    });
  }

  if (CURRENT.role === "MANAGER") {
    db.collection("dailyInput").onSnapshot(() => {
      const dt = document.getElementById("mgrDate")?.value;
      const st = document.getElementById("mgrShift")?.value;
      if (dt && st) loadManagerDashboard();
    });
  }
}

/************************************************************************
 * AUTO RENDER PANEL (ISD / Manager)
 ************************************************************************/
(function waitPanel() {
  const t = setInterval(() => {
    if (!CURRENT.role) return;

    if (CURRENT.role === "ISD") renderISDPanel();
    if (CURRENT.role === "MANAGER") renderManagerPanel();

    clearInterval(t);
  }, 300);
})();
</script>
